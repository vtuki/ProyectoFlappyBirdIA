# Archivo de configuración de hiperparámetros para agentes de RL
cartpole1:
  env_id: CartPole-v1
  replay_memory_size: 100000
  mini_batch_size: 64
  epsilon_init: 1
  epsilon_decay: 0.9995
  epsilon_min: 0.01
  network_sync_rate: 100
  learning_rate_a: 0.001
  discount_factor_g: 0.99
  stop_on_reward: 100000
  fc1_nodes: 128
  enable_double_dqn: False
  enable_dueling_dqn: True
flappybird1:
  env_id: FlappyBird-v0 # ID del entorno (se usará con gymnasium si se convierte, por ahora es solo descriptivo)
  replay_memory_size: 100000 # Tamaño del buffer de experiencia (memoria de replay)
  mini_batch_size: 32 # Tamaño del mini-lote para el entrenamiento
  epsilon_init: 1 # Valor inicial de epsilon (exploración)
  epsilon_decay: 0.999 # Tasa de decaimiento de epsilon
  epsilon_min: 0.05 # Valor mínimo de epsilon
  network_sync_rate: 10 # Frecuencia de sincronización de la red objetivo (cada cuántos pasos)
  learning_rate_a: 0.0005 # Tasa de aprendizaje (alfa)
  discount_factor_g: 0.99 # Factor de descuento (gamma)
  stop_on_reward: 100000 # Detener entrenamiento al alcanzar esta recompensa (valor alto para no detener)
  fc1_nodes: 512 # Número de nodos en la primera capa completamente conectada (fc1)
  env_make_params: # Parámetros adicionales para la creación del entorno (si aplica)
    use_lidar: False
  enable_double_dqn: True # Habilitar Double DQN
  enable_dueling_dqn: True # Habilitar Dueling DQN